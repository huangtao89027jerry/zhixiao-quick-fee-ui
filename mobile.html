<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>快速收费 · 手机端</title>
  <style>
    @font-face {
      font-family: "HYQiHei-55S";
      src: url("./HYQiHei-55S.otf") format("opentype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    :root {
      --brand: #2f73dc;
      --brand-deep: #255da9;
      --brand-soft: #edf5ff;
      --ink: #24324a;
      --ink-2: #627088;
      --ink-3: #8b97a8;
      --line: #e5ebf3;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--brand);
      font: 14px/1.45 "HYQiHei-55S", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid #8cb9f8;
      outline-offset: 2px;
    }
    svg { display: block; }

    .mobile-app {
      width: min(430px,100vw);
      height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto auto minmax(0,1fr);
      overflow: hidden;
      background: var(--brand);
    }
    .status-bar {
      height: 29px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      color: #fff;
      background: var(--brand);
      font-size: 11px;
      font-weight: 500;
    }
    .status-icons { display: flex; align-items: center; gap: 5px; letter-spacing: -.5px; }
    .app-bar {
      height: 53px;
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      padding: 0 10px;
      color: #fff;
      background: var(--brand);
      text-align: center;
      font-size: 17px;
      font-weight: 500;
    }
    .app-bar button {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 0;
      color: #fff;
      background: transparent;
    }
    .app-bar svg { width: 21px; height: 21px; }
    .screen {
      min-height: 0;
      overflow: auto;
      padding: 10px 12px calc(14px + env(safe-area-inset-bottom));
      background: var(--brand);
    }
    .qr-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 0;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(22,58,116,.18);
    }
    .card-bar {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
    }
    .card-title {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #25334a;
      font-size: 17px;
      font-weight: 400;
    }
    .card-title svg { width: 22px; height: 22px; color: var(--brand); }
    .status-pill {
      height: 24px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 9px;
      color: #169366;
      border-radius: 12px;
      background: #effaf5;
      font-size: 11px;
    }
    .status-pill::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22aa79;
    }
    .qr-hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 26px 18px 8px;
      overflow: hidden;
      text-align: center;
      background: #fff;
    }
    .qr-hero h2 {
      position: relative;
      z-index: 1;
      margin: 0 0 7px;
      color: #1b2638;
      font-size: 19px;
      font-weight: 500;
    }
    .qr-hero > p {
      position: relative;
      z-index: 1;
      margin: 0;
      color: var(--ink-2);
      font-size: 13px;
    }
    .qr-frame {
      position: relative;
      z-index: 1;
      width: 266px;
      margin: 28px auto 20px;
      background: #fff;
    }
    .qr-frame canvas { display: block; width: 266px; height: 266px; }
    .qr-actions {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      align-items: center;
      padding: 0 10px 8px;
      border-top: 1px solid #eef1f5;
    }
    .qr-action {
      position: relative;
      height: 44px;
      border: 0;
      color: #667895;
      background: transparent;
      font-size: 14px;
    }
    .qr-action + .qr-action::before {
      content: "";
      position: absolute;
      left: 0;
      top: 9px;
      width: 1px;
      height: 26px;
      background: #e8edf4;
    }
    .qr-action:hover { color: var(--brand); }
    .btn {
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 12px;
      border: 1px solid #d5dde8;
      border-radius: 7px;
      color: var(--ink);
      background: #fff;
      white-space: nowrap;
    }
    .btn.primary { color: #fff; border-color: var(--brand); background: var(--brand); }
    .btn svg { width: 17px; height: 17px; }
    .btn:disabled { opacity: .46; cursor: not-allowed; }

    .toast {
      position: fixed;
      z-index: 80;
      left: 50%;
      top: 90px;
      padding: 10px 15px;
      border-radius: 5px;
      color: #fff;
      background: rgba(27,41,60,.94);
      box-shadow: 0 8px 24px rgba(17,36,60,.18);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%,-8px);
      transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%,0); }

    .sheet {
      position: fixed;
      z-index: 40;
      inset: 0;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(20,36,58,.45);
    }
    .sheet.open { display: flex; }
    .sheet-panel {
      width: min(430px,100%);
      max-height: 92vh;
      overflow: auto;
      border-radius: 18px 18px 0 0;
      background: #fff;
      box-shadow: 0 -10px 38px rgba(19,37,62,.18);
      animation: sheet-in .2s ease both;
    }
    @keyframes sheet-in { from { transform: translateY(20px); opacity: 0; } }
    .sheet-head {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 17px;
      color: var(--ink);
      border-bottom: 1px solid var(--line);
    }
    .sheet-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
    .icon-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 4px;
      color: #77859a;
      background: transparent;
    }
    .icon-btn svg { width: 20px; height: 20px; }
    .sheet-body { padding: 16px; }
    .amount-choices { display: grid; gap: 9px; }
    .amount-option {
      width: 100%;
      min-height: 66px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: #fff;
      text-align: left;
    }
    .amount-option.selected {
      border-color: #9fc0ed;
      background: #f5f9ff;
      box-shadow: inset 0 0 0 1px rgba(47,115,220,.08);
    }
    .choice-radio {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      border: 1.5px solid #bdc8d6;
      border-radius: 50%;
      background: #fff;
    }
    .amount-option.selected .choice-radio {
      border: 5px solid var(--brand);
    }
    .choice-copy strong { display: block; font-size: 14px; font-weight: 500; }
    .choice-copy small { display: block; margin-top: 3px; color: var(--ink-3); font-size: 12px; }
    .fixed-field { margin-top: 12px; }
    .fixed-label { display: block; margin-bottom: 7px; color: var(--ink-2); font-size: 12px; }
    .money-input {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 13px;
      border: 1px solid #cfd9e6;
      border-radius: 8px;
      background: #fff;
    }
    .money-input:focus-within { border-color: #70a4f9; box-shadow: 0 0 0 3px rgba(57,123,227,.08); }
    .money-input span { margin-right: 7px; color: #66758c; font-size: 17px; }
    .money-input input {
      width: 100%;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-size: 21px;
      font-weight: 600;
    }
    .sheet-footer {
      display: flex;
      gap: 8px;
      padding: 12px 16px calc(18px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
    }
    .sheet-footer .btn { flex: 1; }
    .poster-body {
      display: grid;
      place-items: center;
      padding: 18px;
      background: #f2f8f4;
    }
    .poster-body img {
      display: block;
      width: min(360px,100%);
      max-height: calc(100vh - 180px);
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(20,68,44,.14);
    }
  </style>
</head>

  <script>
    const state = {
      amountMode: 'input',
      fixedAmount: '0.00',
      editorMode: 'input',
      posterUrl: '',

    };
    const $ = selector => document.querySelector(selector);
    function money(value) {
      return `¥${Number(value).toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    }
    function toast(text) {
      const el = $('#toast');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove('show'), 2000);
    }
    function drawQr(canvas, seed = 'static-qr-nanshan') {
      const ctx = canvas.getContext('2d');
      const size = canvas.width;
      const cells = 29;
      const cell = size / cells;
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, size, size);
      let hash = 2166136261;
      for (const char of seed) {
        hash ^= char.charCodeAt(0);
        hash = Math.imul(hash, 16777619);
      }
      ctx.fillStyle = '#111';
      for (let y = 0; y < cells; y++) {
        for (let x = 0; x < cells; x++) {
          if ((x < 9 && y < 9) || (x > 19 && y < 9) || (x < 9 && y > 19)) continue;
          hash ^= hash << 13;
          hash ^= hash >>> 17;
          hash ^= hash << 5;
          if ((hash >>> 0) % 3) ctx.fillRect(x * cell, y * cell, cell, cell);
        }
      }
      [[1,1],[20,1],[1,20]].forEach(([x,y]) => {
        ctx.fillStyle = '#111';
        ctx.fillRect(x*cell, y*cell, 8*cell, 8*cell);
        ctx.fillStyle = '#fff';
        ctx.fillRect((x+1)*cell, (y+1)*cell, 6*cell, 6*cell);
        ctx.fillStyle = '#111';
        ctx.fillRect((x+2)*cell, (y+2)*cell, 4*cell, 4*cell);
      });
      ctx.fillStyle = '#fff';
      ctx.fillRect(size*.37, size*.41, size*.26, size*.17);
      ctx.fillStyle = '#111';
      ctx.font = '400 13px "HYQiHei-55S","PingFang SC"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('校管家', size/2, size*.52);
    }
    function roundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
    }
    function updateAmountDisplay() {
      const fixed = state.amountMode === 'fixed';
      $('#amount-copy').textContent = fixed ? `固定金额 ${money(state.fixedAmount)}` : '家长自填金额';
    }
    function setEditorMode(mode) {
      state.editorMode = mode;
      document.querySelectorAll('.amount-option').forEach(button => {
        button.classList.toggle('selected', button.dataset.mode === mode);
      });
      $('#fixed-field').hidden = mode !== 'fixed';
    }
    function openAmountEditor() {
      setEditorMode(state.amountMode);
      $('#amount-input').value = state.amountMode === 'fixed' ? state.fixedAmount : '';
      openSheet('amount-sheet');
      if (state.amountMode === 'fixed') $('#amount-input').select();
    }

    function openSheet(id) { $('#' + id).classList.add('open'); }
    function closeSheet(id) { $('#' + id).classList.remove('open'); }

    async function buildPoster(withAmount) {
      await document.fonts.load('400 53px "HYQiHei-55S"');
      const poster = document.createElement('canvas');
      poster.width = 828;
      poster.height = 1124;
      const ctx = poster.getContext('2d');
      const logo = new Image();
      logo.src = `data:image/png;base64,${document.getElementById('wechat-pay-lockup-data').textContent.trim()}`;
      await logo.decode();
      ctx.fillStyle = '#2f73dc';
      ctx.fillRect(0, 0, 828, 1124);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(0, 930);
      ctx.quadraticCurveTo(414, 875, 828, 930);
      ctx.lineTo(828, 1124);
      ctx.lineTo(0, 1124);
      ctx.closePath();
      ctx.fill();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.font = '400 53px "HYQiHei-55S","PingFang SC"';
      ctx.fillText('推荐使用微信支付', 414, 106);
      ctx.fillStyle = '#fff';
      roundedRect(ctx, 160, 212, 508, 579, 24);
      ctx.fill();
      if (withAmount) {
        ctx.fillStyle = '#121212';
        ctx.font = '400 49px "HYQiHei-55S","PingFang SC"';
        ctx.fillText(money(state.fixedAmount), 414, 268);
      }
      const qr = document.createElement('canvas');
      qr.width = 354;
      qr.height = 354;
      drawQr(qr, `poster-${withAmount ? state.fixedAmount : 'input'}-nanshan`);
      const top = withAmount ? 347 : 293;
      ctx.drawImage(qr, 237, top, 354, 354);
      const cx = 414;
      const cy = top + 177;
      ctx.fillStyle = '#fff';
      roundedRect(ctx, cx - 41, cy - 41, 82, 82, 12);
      ctx.fill();
      ctx.fillStyle = '#1b2330';
      roundedRect(ctx, cx - 36, cy - 36, 72, 72, 10);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '400 28px "HYQiHei-55S","PingFang SC"';
      ctx.fillText('校', cx, cy + 1);
      ctx.fillStyle = '#2f73dc';
      ctx.beginPath();
      ctx.arc(cx + 54, cy + 29, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx + 44, cy + 29);
      ctx.lineTo(cx + 52, cy + 37);
      ctx.lineTo(cx + 65, cy + 21);
      ctx.stroke();
      ctx.fillStyle = '#202020';
      ctx.font = '400 22px "HYQiHei-55S","PingFang SC"';
      ctx.fillText('星河教育 · 南山校区', 414, withAmount ? 744 : 690);
      ctx.drawImage(logo, 219, 965, 390, 105);
      return poster;
    }

    async function openPoster() {
      const withAmount = state.amountMode === 'fixed';
      const poster = await buildPoster(withAmount);
      state.posterUrl = poster.toDataURL('image/png');
      state.posterHasAmount = withAmount;
      $('#poster-image').src = state.posterUrl;
      $('#poster-title').textContent = withAmount ? '二维码海报 · 含金额' : '二维码海报 · 家长填写';
      openSheet('poster-sheet');
    }

    $('#set-amount').addEventListener('click', openAmountEditor);
    document.querySelectorAll('.amount-option').forEach(button => {
      button.addEventListener('click', () => {
        setEditorMode(button.dataset.mode);
        if (button.dataset.mode === 'fixed') {
          const input = $('#amount-input');
          if (!input.value && state.amountMode === 'fixed') input.value = state.fixedAmount;
          input.focus();
          input.select();
        }
      });
    });
    $('#amount-close').addEventListener('click', () => closeSheet('amount-sheet'));
    $('#amount-cancel').addEventListener('click', () => closeSheet('amount-sheet'));
    $('#amount-apply').addEventListener('click', () => {
      if (state.editorMode === 'fixed') {
        const value = Number($('#amount-input').value);
        if (!Number.isFinite(value) || value <= 0 || value > 999999) {
          toast('请输入 0.01 至 999999 元的有效金额');
          $('#amount-input').focus();
          return;
        }
        state.fixedAmount = value.toFixed(2);
      }
      state.amountMode = state.editorMode;
      updateAmountDisplay();
      closeSheet('amount-sheet');
    });
    $('#download').addEventListener('click', openPoster);
    $('#poster-close').addEventListener('click', () => closeSheet('poster-sheet'));
    $('#poster-cancel').addEventListener('click', () => closeSheet('poster-sheet'));
    $('#poster-save').addEventListener('click', () => {
      if (!state.posterUrl) return;
      const link = document.createElement('a');
      link.href = state.posterUrl;
      link.download = state.posterHasAmount ? `收款二维码_${state.fixedAmount}元.png` : '收款二维码_家长填写金额.png';
      document.body.append(link);
      link.click();
      link.remove();
      closeSheet('poster-sheet');
      toast('二维码海报已开始下载');
    });
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      closeSheet('amount-sheet');
      closeSheet('poster-sheet');
    });

    updateAmountDisplay();
    drawQr($('#qr'));
  </script>
</body>
</html>
