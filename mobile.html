<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>二维码收款 · 手机端</title>
  <style>
    @font-face {
      font-family: "HYQiHei-55S";
      src: url("./HYQiHei-55S.otf") format("opentype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    :root {
      --brand: #3679e6;
      --brand-dark: #2c68cd;
      --ink: #262626;
      --ink-2: #555;
      --ink-3: #8d8d8d;
      --line: #ececec;
      --green: #15ba11;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: #eef4fb;
      font-family: "HYQiHei-55S", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid rgba(20,85,176,.45); outline-offset: 2px; }
    svg { display: block; }

    .app {
      width: min(430px,100vw);
      height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: 29px 56px minmax(0,1fr);
      overflow: hidden;
      background: #f0f5fb;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      color: #fff;
      background: var(--brand);
      font-size: 12px;
    }
    .app-bar {
      display: grid;
      grid-template-columns: 38px 1fr 38px;
      align-items: center;
      padding: 0 12px;
      color: #fff;
      background: var(--brand);
      text-align: center;
      font-size: 18px;
      font-weight: 500;
    }
    .app-bar button {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 0;
      color: #fff;
      background: transparent;
    }
    .app-bar svg { width: 22px; height: 22px; }
    .screen {
      min-height: 0;
      overflow-y: auto;
      padding: 12px 12px calc(24px + env(safe-area-inset-bottom));
    }

    .qr-card {
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 3px 14px rgba(30,53,83,.05);
    }
    .qr-card { overflow: hidden; }
    .card-head {
      height: 66px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
    }
    .card-head-icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: var(--brand);
    }
    .card-head-icon svg { width: 25px; height: 25px; }
    .card-head strong {
      flex: 1;
      font-size: 18px;
      font-weight: 500;
      white-space: nowrap;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 9px;
      color: #159261;
      border-radius: 12px;
      background: #effaf5;
      font-size: 11px;
      white-space: nowrap;
    }
    .status-pill::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #20aa78;
    }
    .qr-content {
      padding: 31px 20px 23px;
      text-align: center;
    }
    .merchant {
      margin-bottom: 24px;
      color: #222;
      font-size: 17px;
      font-weight: 500;
    }
    .qr-frame {
      width: 254px;
      margin: 0 auto;
      padding: 12px;
      border-radius: 12px;
      background: #fff;
    }
    .qr-frame canvas { display: block; width: 230px; height: 230px; }
    .info-section {
      padding: 0 18px;
    }
    .info-row {
      min-height: 57px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--line);
    }
    .info-copy { min-width: 0; }
    .info-label { display: block; color: #8a94a3; font-size: 12px; }
    .info-value {
      display: block;
      margin-top: 3px;
      color: #4b596d;
      font-size: 16px;
      font-weight: 500;
    }
    .info-value.is-fixed { color: #e7644f; font-size: 20px; font-weight: 600; }
    .text-action {
      padding: 6px 5px;
      border: 0;
      border-radius: 4px;
      color: var(--brand);
      background: transparent;
      font-size: 13px;
    }
    .text-action:hover { background: #f1f6fd; }
    .qr-actions {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 8px;
      padding: 8px 18px 18px;
    }

    .toast {
      position: fixed;
      z-index: 90;
      left: 50%;
      top: 94px;
      max-width: calc(100vw - 48px);
      padding: 10px 15px;
      color: #fff;
      border-radius: 5px;
      background: rgba(24,38,56,.95);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%,-8px);
      transition: .2s ease;
      font-size: 13px;
    }
    .toast.show { opacity: 1; transform: translate(-50%,0); }

    .sheet {
      position: fixed;
      z-index: 40;
      inset: 0;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(15,32,50,.45);
    }
    .sheet.open { display: flex; }
    .sheet-panel {
      width: min(430px,100%);
      max-height: 92vh;
      overflow: auto;
      border-radius: 18px 18px 0 0;
      background: #fff;
      box-shadow: 0 -8px 30px rgba(23,43,70,.18);
      animation: rise .2s ease both;
    }
    @keyframes rise { from { transform: translateY(20px); opacity: 0; } }
    .sheet-head {
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 17px;
      border-bottom: 1px solid var(--line);
    }
    .sheet-head h2 { margin: 0; font-size: 17px; font-weight: 500; }
    .icon-button {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 4px;
      color: #8691a2;
      background: transparent;
    }
    .icon-button svg { width: 20px; height: 20px; }
    .sheet-body { padding: 18px 18px 22px; }
    .setting-row {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }
    .setting-row:last-child { border-bottom: 0; }
    .setting-row label { flex: 1; color: #343434; }
    .setting-row small { display: block; margin-top: 4px; color: #8d8d8d; font-size: 12px; }
    .amount-line { display: flex; align-items: center; gap: 8px; }
    #amount-form .setting-row { display: block; padding: 9px 0 3px; border-bottom: 0; }
    #amount-form .amount-line { margin-top: 12px; }
    .amount-input {
      height: 40px;
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border: 1px solid #cbd6e4;
      border-radius: 7px;
      background: #fff;
    }
    .amount-input span { margin-right: 7px; color: #666; }
    .amount-input input {
      width: 100%;
      border: 0;
      outline: 0;
      color: #222;
      background: transparent;
      font-size: 20px;
      text-align: right;
    }
    .btn {
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 15px;
      border: 1px solid #d5dbe3;
      border-radius: 7px;
      color: #343434;
      background: #fff;
      white-space: nowrap;
    }
    .btn.primary { color: #fff; border-color: var(--brand); background: var(--brand); }
    .btn svg { width: 18px; height: 18px; }
    .switch {
      position: relative;
      width: 44px;
      height: 25px;
      padding: 2px;
      border: 0;
      border-radius: 13px;
      background: #ccd4df;
      flex: 0 0 auto;
    }
    .switch::after {
      content: "";
      display: block;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
      transition: transform .18s;
    }
    .switch[aria-checked="true"] { background: var(--brand); }
    .switch[aria-checked="true"]::after { transform: translateX(19px); }
    .sheet-actions {
      display: flex;
      gap: 8px;
      padding: 12px 18px calc(18px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
    }
    .sheet-actions .btn { flex: 1; }

    .parent-card {
      padding: 15px;
      border-radius: 10px;
      background: #f5f9ff;
    }
    .student {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px;
      border-radius: 8px;
      background: #fff;
    }
    .avatar {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--brand);
      background: #e8f2ff;
      font-weight: 500;
    }
    .student strong { display: block; margin-bottom: 3px; }
    .student small { color: #8c96a4; }
    .pay-box {
      margin-top: 12px;
      padding: 16px;
      border-radius: 9px;
      background: #fff;
    }
    .pay-box h3 { margin: 0 0 6px; font-size: 18px; font-weight: 500; }
    .pay-box p { margin: 0; color: #777; font-size: 12px; }
    .total {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #eee;
    }
    .total strong { color: #e7644f; font-size: 22px; font-weight: 500; }
    .pay-button { width: 100%; margin-top: 16px; }
    .poster-body { padding: 16px; background: #f2f8f4; }
    .poster-body img { display: block; width: 100%; border-radius: 8px; }
  </style>
</head>
<body>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 21c.8-4 3.2-6 7-6s6.2 2 7 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="m5 15 7-7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>

    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19v2h16v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Zm3 5h6m-6 4h6m-6 4h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>

  </svg>

  <div class="app">
    <div class="status-bar"><span>09:41</span><span>▮▮▮　◉　52%</span></div>
    <header class="app-bar">
      <button aria-label="返回"><svg><use href="#i-left"/></svg></button>
      <span>二维码收款</span>
      <button aria-label="更多"><svg><use href="#i-more"/></svg></button>
    </header>

    <main class="screen">
      <section class="qr-card">
        <div class="card-head">
          <span class="card-head-icon"><svg><use href="#i-user"/></svg></span>
          <strong>静态二维码</strong>
          <span class="status-pill">长期有效</span>
        </div>
        <div class="qr-content">
          <div class="merchant">星河教育 · 南山校区</div>
          <div class="qr-frame"><canvas id="qr" width="230" height="230" aria-label="静态二维码示意图"></canvas></div>
        </div>

        <div class="info-section">
          <div class="info-row">
            <div class="info-copy">
              <span class="info-label">收款金额</span>
              <strong class="info-value" id="amount-summary">家长自填</strong>
            </div>
            <button class="text-action" id="amount-setting">设置</button>
          </div>
          <div class="info-row">
            <div class="info-copy">
              <span class="info-label">包含老师信息</span>
              <strong class="info-value" id="teacher-copy">经手人：张老师</strong>
            </div>
            <button class="switch" id="teacher-switch" role="switch" aria-checked="true" aria-label="包含老师信息"></button>
          </div>
        </div>
        <div class="qr-actions">
          <button class="btn primary" id="save-code"><svg><use href="#i-download"/></svg>下载二维码</button>
          <button class="btn" id="experience"><svg><use href="#i-scan"/></svg>体验扫码</button>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="sheet" id="amount-sheet" role="dialog" aria-modal="true" aria-labelledby="amount-title">
    <section class="sheet-panel">
      <header class="sheet-head">
        <h2 id="amount-title">收款设置</h2>
        <button class="icon-button" data-close="amount-sheet" aria-label="关闭"><svg><use href="#i-close"/></svg></button>
      </header>
      <form id="amount-form">
        <div class="sheet-body">
          <div class="setting-row">
            <label>固定收款金额<small>设置后家长不可修改</small></label>
            <div class="amount-line">
              <div class="amount-input"><span>¥</span><input id="amount-input" inputmode="decimal" autocomplete="off" aria-label="固定收款金额" placeholder="0.00"></div>
            </div>
          </div>
        </div>
        <div class="sheet-actions">
          <button type="button" class="btn" id="clear-amount">家长自填</button>
          <button type="submit" class="btn primary">保存</button>
        </div>
      </form>
    </section>
  </div>

  <div class="sheet" id="parent-sheet" role="dialog" aria-modal="true" aria-labelledby="parent-title">
    <section class="sheet-panel">
      <header class="sheet-head">
        <h2 id="parent-title">家长扫码体验</h2>
        <button class="icon-button" data-close="parent-sheet" aria-label="关闭"><svg><use href="#i-close"/></svg></button>
      </header>
      <div class="sheet-body" id="parent-body"></div>
      <div class="sheet-actions"><button class="btn" id="parent-reset">重新体验</button><button class="btn primary" data-close="parent-sheet">返回后台</button></div>
    </section>
  </div>

  <div class="sheet" id="poster-sheet" role="dialog" aria-modal="true" aria-labelledby="poster-title">
    <section class="sheet-panel">
      <header class="sheet-head">
        <h2 id="poster-title">二维码海报</h2>
        <button class="icon-button" data-close="poster-sheet" aria-label="关闭"><svg><use href="#i-close"/></svg></button>
      </header>
      <div class="poster-body"><img id="poster-image" alt="待下载的二维码海报"></div>
      <div class="sheet-actions"><button class="btn" data-close="poster-sheet">取消</button><button class="btn primary" id="poster-save"><svg><use href="#i-download"/></svg>保存图片</button></div>
    </section>

  <script>
    const state = {
      amountMode: 'input',
      fixedAmount: '0.00',
      teacher: true,
      parentAmount: '',
      paid: false,
      posterUrl: '',
      posterHasAmount: false
    };
    const $ = selector => document.querySelector(selector);
    function money(value) {
      return `¥${Number(value).toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    }
    function toast(text) {
      const el = $('#toast');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove('show'), 2000);
    }
    function openSheet(id) { $('#' + id).classList.add('open'); }
    function closeSheet(id) { $('#' + id).classList.remove('open'); }

    function drawQr(canvas, seed = 'static-qr-nanshan') {
      const ctx = canvas.getContext('2d');
      const size = canvas.width;
      const cells = 29;
      const cell = size / cells;
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, size, size);
      let hash = 2166136261;
      for (const char of seed) {
        hash ^= char.charCodeAt(0);
        hash = Math.imul(hash, 16777619);
      }
      ctx.fillStyle = '#142033';
      for (let y = 0; y < cells; y++) {
        for (let x = 0; x < cells; x++) {
          if ((x < 9 && y < 9) || (x > 19 && y < 9) || (x < 9 && y > 19)) continue;
          hash ^= hash << 13;
          hash ^= hash >>> 17;
          hash ^= hash << 5;
          if ((hash >>> 0) % 3) ctx.fillRect(x * cell, y * cell, cell, cell);
        }
      }
      [[1,1],[20,1],[1,20]].forEach(([x,y]) => {
        ctx.fillStyle = '#142033';
        ctx.fillRect(x*cell, y*cell, 8*cell, 8*cell);
        ctx.fillStyle = '#fff';
        ctx.fillRect((x+1)*cell, (y+1)*cell, 6*cell, 6*cell);
        ctx.fillStyle = '#142033';
        ctx.fillRect((x+2)*cell, (y+2)*cell, 4*cell, 4*cell);
      });
      ctx.fillStyle = '#fff';
      ctx.fillRect(size*.37, size*.41, size*.26, size*.17);
      ctx.fillStyle = '#142033';
      ctx.font = '400 14px "HYQiHei-55S","PingFang SC"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('校管家', size/2, size*.52);
    }
    function roundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
    }
    function updateAmount() {
      const fixed = state.amountMode === 'fixed';
      $('#amount-summary').textContent = fixed ? money(state.fixedAmount) : '家长自填';
      $('#amount-summary').classList.toggle('is-fixed', fixed);
      $('#amount-setting').textContent = fixed ? '修改' : '设置';
      $('#amount-input').value = fixed ? state.fixedAmount : '';
    }

    function renderParent() {
      const amount = Number(state.amountMode === 'fixed' ? state.fixedAmount : state.parentAmount || 100);
      if (state.paid) {
        $('#parent-body').innerHTML = `<div class="parent-card" style="text-align:center;padding:36px 16px"><div style="width:56px;height:56px;display:grid;place-items:center;margin:0 auto 15px;border-radius:50%;background:#0e9f6e;color:#fff"><svg style="width:28px;height:28px"><use href="#i-check"/></svg></div><h2 style="margin:0;font-size:21px;font-weight:500">支付成功</h2><div style="margin:12px 0 5px;color:#e7644f;font-size:32px;font-weight:500">${money(amount)}</div><p style="margin:0;color:#777">已支付至星河教育·南山商户</p></div>`;
        return;
      }
      $('#parent-body').innerHTML = `<div class="parent-card"><div class="student"><span class="avatar">满</span><div><strong>林小满</strong><small>138****8001</small></div></div><div class="pay-box"><h3>${state.amountMode === 'fixed' ? '固定收款金额' : '请输入付款金额'}</h3><p>${state.amountMode === 'fixed' ? '收款方已设置金额，不可修改。' : '请核对本次缴费金额后支付。'}</p>${state.amountMode === 'fixed' ? `<div class="total"><span>本次应付</span><strong>${money(amount)}</strong></div>` : '<div class="amount-input" style="margin-top:14px"><span>¥</span><input id="parent-amount" inputmode="decimal" placeholder="0.00" value=""></div>'}<button class="btn primary pay-button" id="parent-pay">立即支付</button></div></div>`;
      $('#parent-pay').addEventListener('click', () => {
        if (state.amountMode === 'input') {
          const input = $('#parent-amount');
          state.parentAmount = input.value.trim();
          if (!Number.isFinite(Number(state.parentAmount)) || Number(state.parentAmount) <= 0) {
            input.focus();
            toast('请输入大于 0 的付款金额');
            return;
          }
        }
        state.paid = true;
        renderParent();
      });
    }

    async function buildPoster(withAmount) {
      await document.fonts.load('400 53px "HYQiHei-55S"');
      const poster = document.createElement('canvas');
      poster.width = 828;
      poster.height = 1124;
      const ctx = poster.getContext('2d');
      const logo = new Image();
      logo.src = `data:image/png;base64,${document.getElementById('wechat-pay-lockup-data').textContent.trim()}`;
      await logo.decode();
      ctx.fillStyle = '#2f73dc';
      ctx.fillRect(0, 0, 828, 1124);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(0, 930);
      ctx.quadraticCurveTo(414, 875, 828, 930);
      ctx.lineTo(828, 1124);
      ctx.lineTo(0, 1124);
      ctx.closePath();
      ctx.fill();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.font = '400 53px "HYQiHei-55S","PingFang SC"';
      ctx.fillText('推荐使用微信支付', 414, 106);
      ctx.fillStyle = '#fff';
      roundedRect(ctx, 160, 212, 508, 579, 24);
      ctx.fill();
      if (withAmount) {
        ctx.fillStyle = '#121212';
        ctx.font = '400 49px "HYQiHei-55S","PingFang SC"';
        ctx.fillText(money(state.fixedAmount), 414, 268);
      }
      const qr = document.createElement('canvas');
      qr.width = 354;
      qr.height = 354;
      drawQr(qr, `poster-${withAmount ? state.fixedAmount : 'input'}-nanshan`);
      const qrTop = withAmount ? 347 : 293;
      ctx.drawImage(qr, 237, qrTop, 354, 354);
      const cx = 414;
      const cy = qrTop + 177;
      ctx.fillStyle = '#fff';
      roundedRect(ctx, cx - 41, cy - 41, 82, 82, 12);
      ctx.fill();
      ctx.fillStyle = '#1b2330';
      roundedRect(ctx, cx - 36, cy - 36, 72, 72, 10);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '400 28px "HYQiHei-55S","PingFang SC"';
      ctx.fillText('校', cx, cy + 1);
      ctx.fillStyle = '#2f73dc';
      ctx.beginPath();
      ctx.arc(cx + 54, cy + 29, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(cx + 44, cy + 29);
      ctx.lineTo(cx + 52, cy + 37);
      ctx.lineTo(cx + 65, cy + 21);
      ctx.stroke();
      ctx.fillStyle = '#202020';
      ctx.font = '400 22px "HYQiHei-55S","PingFang SC"';
      ctx.fillText('星河教育 · 南山校区', 414, withAmount ? 744 : 690);
      ctx.drawImage(logo, 219, 965, 390, 105);
      return poster;
    }

    async function openPoster() {
      const withAmount = state.amountMode === 'fixed';
      const poster = await buildPoster(withAmount);
      state.posterUrl = poster.toDataURL('image/png');
      state.posterHasAmount = withAmount;
      $('#poster-image').src = state.posterUrl;
      $('#poster-title').textContent = withAmount ? '二维码海报 · 含金额' : '二维码海报 · 家长填写';
      openSheet('poster-sheet');
    }

    $('#amount-setting').addEventListener('click', () => {
      $('#amount-input').value = state.amountMode === 'fixed' ? state.fixedAmount : '';
      openSheet('amount-sheet');
      $('#amount-input').focus();
      $('#amount-input').select();
    });
    $('#amount-form').addEventListener('submit', event => {
      event.preventDefault();
      const value = Number($('#amount-input').value);
      if (!Number.isFinite(value) || value <= 0 || value > 999999) {
        toast('请输入 0.01 至 999999 元的有效金额');
        $('#amount-input').focus();
        return;
      }
      state.amountMode = 'fixed';
      state.fixedAmount = value.toFixed(2);
      updateAmount();
      closeSheet('amount-sheet');
    });
    $('#clear-amount').addEventListener('click', () => {
      state.amountMode = 'input';
      updateAmount();
      closeSheet('amount-sheet');
    });
    $('#teacher-switch').addEventListener('click', () => {
      state.teacher = !state.teacher;
      $('#teacher-switch').setAttribute('aria-checked', state.teacher);
      $('#teacher-copy').textContent = state.teacher ? '经手人：张老师' : '不记录经手人';
    });
    $('#experience').addEventListener('click', () => {
      state.paid = false;
      state.parentAmount = '';
      renderParent();
      openSheet('parent-sheet');
    });
    $('#parent-reset').addEventListener('click', () => {
      state.paid = false;
      state.parentAmount = '';
      renderParent();
    });
    $('#save-code').addEventListener('click', openPoster);
    $('#poster-save').addEventListener('click', () => {
      if (!state.posterUrl) return;
      const link = document.createElement('a');
      link.href = state.posterUrl;
      link.download = state.posterHasAmount ? `收款二维码_${state.fixedAmount}元.png` : '收款二维码_家长填写金额.png';
      document.body.append(link);
      link.click();
      link.remove();
      closeSheet('poster-sheet');
      toast('二维码海报已开始下载');
    });
    document.addEventListener('click', event => {
      const close = event.target.closest('[data-close]');
      if (close) closeSheet(close.dataset.close);
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') document.querySelectorAll('.sheet.open').forEach(el => el.classList.remove('open'));
    });

    updateAmount();
    drawQr($('#qr'));
  </script>
</body>
</html>
