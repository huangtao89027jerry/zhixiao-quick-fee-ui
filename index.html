<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>快速收费 · 静态二维码</title>
  <style>
    @font-face {
      font-family: "HYQiHei-55S";
      src: url("./HYQiHei-55S.otf") format("opentype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "JingBeiNumber";
      src: url("./JingBeiNumber-Bold.ttf") format("truetype");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }
    :root {
      --brand: #2868c7;
      --brand-strong: #397be3;
      --brand-soft: #edf5ff;
      --nav: #2b5fa8;
      --ink: #24324a;
      --ink-2: #5d6b80;
      --ink-3: #8b97a8;
      --line: #e6eaf0;
      --line-strong: #d7dde6;
      --success: #0e9f6e;
      --shadow: 0 16px 50px rgba(20, 49, 89, .16);
      --money-font: "JingBeiNumber", "HYQiHei-55S", sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: #dfe4eb;
      font: 14px/1.45 "HYQiHei-55S", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid #78aaff;
      outline-offset: 2px;
    }
    svg { display: block; }
    .money-number {
      font-family: var(--money-font);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .app {
      width: 100vw;
      height: 100vh;
      min-width: 1080px;
      display: grid;
      grid-template-rows: 76px minmax(0, 1fr);
      overflow: hidden;
      background: #fff;
    }
    .mobile-bar { display: none; }
    .topbar { display: flex; color: #fff; background: var(--nav); }
    .brand {
      width: 220px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .modules { display: flex; flex: 1; gap: 8px; }
    .module {
      min-width: 104px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 15px;
      border: 0;
      color: rgba(255,255,255,.78);
      background: transparent;
      font-size: 13px;
    }
    .module:hover, .module.active { color: #fff; background: rgba(255,255,255,.07); }
    .module svg { width: 23px; height: 23px; }
    .top-actions { display: flex; align-items: center; gap: 18px; padding-right: 28px; }
    .campus {
      width: 154px;
      height: 36px;
      padding: 0 34px 0 20px;
      color: #fff;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      outline: 0;
      background-color: rgba(255,255,255,.13);
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, rgba(255,255,255,.9) 50%),
        linear-gradient(135deg, rgba(255,255,255,.9) 50%, transparent 50%);
      background-position: calc(100% - 18px) 15px, calc(100% - 13px) 15px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .campus option { color: var(--ink); }
    .avatar {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
    }
    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 220px minmax(0,1fr);
    }
    .sidebar {
      padding: 15px 14px;
      color: #4b5768;
      background: #f7f8fa;
      border-right: 1px solid var(--line);
    }
    .side-label { padding: 14px 18px 18px; font-weight: 500; }
    .side-nav { display: grid; gap: 4px; }
    .side-item {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      height: 50px;
      gap: 15px;
      padding: 0 18px;
      border: 0;
      border-radius: 4px;
      color: #4b5768;
      background: transparent;
      text-align: left;
    }
    .side-item::before {
      content: "";
      width: 5px;
      height: 5px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #69758a;
    }
    .side-item:hover { background: #eef2f7; }
    .side-item.active { color: #286aef; background: #e9f3ff; font-weight: 500; }
    .side-item.active::before { background: #2a72f5; }
    .side-item.active::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: #2a72f5;
    }
    .side-gap { height: 14px; }

    .main {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      background:
        radial-gradient(circle at 50% 2%,rgba(57,123,227,.075),transparent 32%),
        #f4f7fb;
    }
    .content {
      width: min(1120px,100%);
      min-height: 100%;
      margin: 0 auto;
      padding: 0 40px 34px;
    }
    .breadcrumb {
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 40px;
      margin: 0 -40px;
      color: #647185;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .breadcrumb strong { color: #506077; font-weight: 500; }

    .page-stack {
      width: min(900px,100%);
      margin: 0 auto;
    }
    .page-title { padding: 12px 0 10px; }
    .page-title h1 {
      margin: 0;
      color: #1f2e45;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: .2px;
    }
    .page-title p { margin: 6px 0 0; color: #65748a; font-size: 14px; }

    .qr-panel {
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0,1fr) 320px;
      border: 1px solid rgba(214,224,237,.92);
      border-radius: 18px;
      background: #fff;
      box-shadow:
        0 18px 48px rgba(31,63,103,.10),
        0 2px 8px rgba(31,63,103,.04);
    }
    .card-head {
      grid-column: 1 / -1;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 26px;
      border-bottom: 1px solid var(--line);
    }
    .card-head strong {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #2d3d55;
      font-size: 18px;
      font-weight: 500;
    }
    .card-head svg { width: 22px; height: 22px; color: var(--brand); }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 9px;
      color: #169366;
      border-radius: 12px;
      background: #effaf5;
      font-size: 11px;
    }
    .status-chip::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22aa79;
    }
    .card-hero {
      position: relative;
      padding: 28px 26px 20px;
      overflow: hidden;
      text-align: center;
      border-right: 1px solid var(--line);
      background:
        radial-gradient(circle at 50% 6%,rgba(57,123,227,.08),transparent 34%),
        linear-gradient(180deg,#f2f7ff 0,#fbfdff 42%,#fff 76%);
    }
    .card-hero::before,
    .card-hero::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(57,123,227,.08);
      border-radius: 50%;
    }
    .card-hero::before { width: 220px; height: 220px; left: -140px; top: 24px; }
    .card-hero::after { width: 180px; height: 180px; right: -110px; bottom: -112px; }
    .card-hero h1 {
      position: relative;
      z-index: 1;
      margin: 0 0 6px;
      color: #1f2e45;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .card-hero > p {
      position: relative;
      z-index: 1;
      margin: 0;
      color: #66758c;
      font-size: 14px;
    }
    .fixed-amount {
      position: relative;
      z-index: 1;
      display: block;
      margin-top: 16px;
      color: #1f2e45;
      font-family: var(--money-font);
      font-size: 38px;
      font-weight: 700;
      line-height: 1.2;
    }
    .qr-frame {
      position: relative;
      z-index: 1;
      width: 276px;
      margin: 26px auto 16px;
      padding: 12px;
      border: 1px solid #e7edf5;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 30px rgba(35,64,103,.10);
    }
    .qr-frame canvas { display: block; width: 250px; height: 250px; }
    .amount-actions {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 18px;
    }
    .link-button {
      height: 40px;
      padding: 0 8px;
      border: 0;
      color: var(--brand);
      background: transparent;
      font-size: 15px;
    }
    .qr-note { position: relative; z-index: 1; margin: 10px 0 0; color: var(--ink-2); font-size: 12px; }
    .card-settings {
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 28px 26px 24px;
    }
    .settings-intro { margin-bottom: 18px; }
    .settings-intro h2 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
    .settings-intro p { margin: 0; color: var(--ink-2); font-size: 12px; line-height: 1.65; }
    .teacher-setting {
      padding: 18px 0;
      border-top: 1px solid var(--line);
    }
    .teacher-setting label { display: flex; align-items: center; gap: 10px; }
    .teacher-copy strong { display: block; color: #34435a; font-size: 14px; font-weight: 500; }
    .teacher-copy span { display: block; margin-top: 4px; color: #7b879a; font-size: 12px; }
    .switch {
      position: relative;
      width: 38px;
      height: 21px;
      padding: 2px;
      border: 0;
      border-radius: 12px;
      background: #c9d2df;
      transition: background .18s;
    }
    .switch::after {
      content: "";
      display: block;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.18);
      transition: transform .18s;
    }
    .switch[aria-checked="true"] { background: var(--brand-strong); }
    .switch[aria-checked="true"]::after { transform: translateX(17px); }
    .settings-actions {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }
    .settings-actions .btn { width: 100%; height: 48px; border-radius: 10px; font-size: 15px; }
    .btn {
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 16px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      color: var(--ink);
      background: #fff;
      white-space: nowrap;
      transition: border-color .15s, color .15s, background .15s;
    }
    .btn:hover { color: var(--brand); border-color: #a9bfdf; }
    .btn.primary { color: #fff; border-color: var(--brand-strong); background: var(--brand-strong); }
    .btn.primary:hover { color: #fff; border-color: #2d70dc; background: #2d70dc; }
    .btn svg { width: 16px; height: 16px; }

    .toast {
      position: fixed;
      z-index: 80;
      left: 50%;
      top: 94px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      color: #fff;
      border-radius: 4px;
      background: rgba(28,42,61,.94);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%,-8px);
      transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%,0); }
    .toast svg { width: 16px; height: 16px; color: #78e0b7; }

    .overlay {
      position: fixed;
      z-index: 40;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(23,38,59,.48);
      backdrop-filter: blur(2px);
    }
    .overlay.open { display: flex; }
    .dialog {
      width: min(570px,94vw);
      max-height: calc(100vh - 48px);
      overflow: auto;
      border-radius: 16px;
      background: #fff;
      box-shadow: var(--shadow);
    }
    .dialog-head {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px 0 22px;
      color: var(--ink);
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .dialog-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
    .icon-button {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 3px;
      color: #77859a;
      background: transparent;
    }
    .icon-button:hover { background: #f1f4f8; }
    .icon-button svg { width: 18px; height: 18px; }
    .dialog-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 22px 18px;
      border-top: 1px solid var(--line);
    }
    .poster-dialog { width: min(480px,94vw); overflow: hidden; }
    .poster-preview {
      display: grid;
      place-items: center;
      max-height: calc(100vh - 150px);
      padding: 22px;
      overflow: auto;
      background: #f1f8f3;
    }
    .poster-preview img {
      display: block;
      width: min(330px,100%);
      max-height: calc(100vh - 194px);
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 12px 30px rgba(22,72,46,.14);
    }
    .poster-mode { color: var(--ink-2); font-size: 12px; font-weight: 400; }
    .amount-dialog { width: min(420px,94vw); }
    .amount-dialog-body { padding: 22px; }
    .amount-dialog-label { display: block; color: var(--ink-2); font-size: 13px; }
    .amount-dialog-input {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-top: 8px;
      padding: 10px 0 12px;
      border-bottom: 1px solid #dbe3ee;
    }
    .amount-dialog-input > span { color: var(--ink); font-size: 26px; }
    .amount-dialog-input input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-family: var(--money-font);
      font-size: 32px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 1160px) {
      .brand { width: 200px; padding: 0 22px; }
      .workspace { grid-template-columns: 200px minmax(0,1fr); }
      .module { min-width: 92px; padding-inline: 10px; }
      .content { padding-inline: 28px; }
      .breadcrumb { padding-inline: 28px; margin-inline: -28px; }
    }
    @media (max-width: 760px) {
      .app {
        min-width: 0;
        grid-template-rows: 54px minmax(0,1fr);
        background: #f4f7fb;
      }
      .topbar, .sidebar { display: none; }
      .mobile-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        color: #fff;
        background: var(--nav);
        font-weight: 500;
      }
      .mobile-bar button {
        width: 30px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 0;
        color: #fff;
        background: transparent;
      }
      .mobile-bar svg { width: 19px; height: 19px; }
      .workspace { display: block; }
      .main { height: 100%; background: #f4f7fb; }
      .content { min-height: 100%; padding: 0 12px 24px; }
      .breadcrumb { display: none; }
      .page-stack { width: 100%; }
      .page-title { padding: 16px 4px 12px; }
      .page-title h1 { font-size: 21px; }
      .page-title p { font-size: 13px; }
      .qr-panel { border-radius: 14px; }
      .qr-panel { display: block; }
      .card-head { display: flex; }
      .card-hero { padding: 24px 16px 19px; }
      .card-hero { border-right: 0; }
      .settings-intro { margin-bottom: 13px; }
      .card-hero h1 { font-size: 23px; }
      .qr-frame { width: 224px; padding: 12px; }
      .qr-frame canvas { width: 198px; height: 198px; }
      .card-settings { padding: 0 16px 17px; }
      .teacher-setting { padding-inline: 12px; }
      .dialog { width: calc(100vw - 24px); border-radius: 14px; }
      .dialog-footer { padding-inline: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>

      <header class="dialog-head">
        <h2 id="poster-title">二维码海报 <span class="poster-mode" id="poster-mode"></span></h2>
        <button class="icon-button" id="poster-close" aria-label="关闭"><svg><use href="#i-close"/></svg></button>
      </header>
      <div class="poster-preview">
        <img id="poster-image" alt="待下载的收款二维码海报">
      </div>
      <footer class="dialog-footer">
        <button class="btn" id="poster-cancel">取消</button>
        <button class="btn primary" id="poster-save"><svg><use href="#i-download"/></svg>保存图片</button>
      </footer>
    </section>
  </div>

  <script>
    const state = {
      amountMode: 'input',
      fixedAmount: '0.00',
      teacher: true,
      posterUrl: '',
      posterHasAmount: false
    };
    const $ = selector => document.querySelector(selector);

    function money(value) {
      return `¥${Number(value).toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    }
    function toast(text) {
      const el = $('#toast');
      $('#toast-text').textContent = text;
      el.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove('show'), 2000);
    }
    function drawQr(canvas, seed = 'static-qr-nanshan') {
      const ctx = canvas.getContext('2d');
      const size = canvas.width;
      const cells = 29;
      const cell = size / cells;
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, size, size);
      let hash = 2166136261;
      for (const char of seed) {
        hash ^= char.charCodeAt(0);
        hash = Math.imul(hash, 16777619);
      }
      ctx.fillStyle = '#17263d';
      for (let y = 0; y < cells; y++) {
        for (let x = 0; x < cells; x++) {
          if ((x < 9 && y < 9) || (x > 19 && y < 9) || (x < 9 && y > 19)) continue;
          hash ^= hash << 13;
          hash ^= hash >>> 17;
          hash ^= hash << 5;
          if ((hash >>> 0) % 3) ctx.fillRect(x * cell, y * cell, cell, cell);
        }
      }
      [[1,1],[20,1],[1,20]].forEach(([x,y]) => {
        ctx.fillStyle = '#17263d';
        ctx.fillRect(x*cell, y*cell, 8*cell, 8*cell);
        ctx.fillStyle = '#fff';
        ctx.fillRect((x+1)*cell, (y+1)*cell, 6*cell, 6*cell);
        ctx.fillStyle = '#17263d';
        ctx.fillRect((x+2)*cell, (y+2)*cell, 4*cell, 4*cell);
      });
      ctx.fillStyle = '#fff';
      ctx.fillRect(size*.32, size*.41, size*.36, size*.17);
      ctx.fillStyle = '#17263d';
      ctx.font = '400 15px "HYQiHei-55S","PingFang SC"';
      ctx.textAlign = 'center';
      ctx.fillText('示意码', size/2, size*.52);
    }

    function roundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
    }

    async function buildPoster(withAmount) {
      await document.fonts.load('400 58px "HYQiHei-55S"');
      await document.fonts.load('700 49px "JingBeiNumber"');
      const poster = document.createElement('canvas');
      poster.width = 828;
      poster.height = 1124;
      const ctx = poster.getContext('2d');
      const officialLogo = new Image();
      officialLogo.src = `data:image/png;base64,${document.getElementById('wechat-pay-lockup-data').textContent.trim()}`;
      await officialLogo.decode();

      ctx.fillStyle = '#2f73dc';
      ctx.fillRect(0, 0, 828, 1124);

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(0, 930);
      ctx.quadraticCurveTo(414, 875, 828, 930);
      ctx.lineTo(828, 1124);
      ctx.lineTo(0, 1124);
      ctx.closePath();
      ctx.fill();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.font = '400 53px "HYQiHei-55S","PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('推荐使用微信支付', 414, 106);

      ctx.fillStyle = '#fff';
      roundedRect(ctx, 160, 212, 508, 579, 24);
      ctx.fill();

      if (withAmount) {
        ctx.fillStyle = '#121212';
        ctx.font = '700 49px "JingBeiNumber","HYQiHei-55S",sans-serif';
        ctx.fillText(money(state.fixedAmount), 414, 268);
      }

      const qrSize = 354;
      const qrX = 237;
      const qrTop = withAmount ? 347 : 293;
      const qrCanvas = document.createElement('canvas');
      qrCanvas.width = qrSize;
      qrCanvas.height = qrSize;
      drawQr(qrCanvas, `poster-${withAmount ? state.fixedAmount : 'input'}-nanshan`);
      ctx.drawImage(qrCanvas, qrX, qrTop, qrSize, qrSize);

      const centerX = 414;
      const centerY = qrTop + 177;
      ctx.fillStyle = '#fff';
      roundedRect(ctx, centerX - 41, centerY - 41, 82, 82, 12);
      ctx.fill();
      ctx.fillStyle = '#1b2330';
      roundedRect(ctx, centerX - 36, centerY - 36, 72, 72, 10);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '400 28px "HYQiHei-55S","PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('校', centerX, centerY + 1);

      ctx.fillStyle = '#2f73dc';
      ctx.beginPath();
      ctx.arc(centerX + 54, centerY + 29, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(centerX + 44, centerY + 29);
      ctx.lineTo(centerX + 52, centerY + 37);
      ctx.lineTo(centerX + 65, centerY + 21);
      ctx.stroke();

      ctx.fillStyle = '#202020';
      ctx.font = '400 22px "HYQiHei-55S","PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('星河教育 · 南山校区', 414, withAmount ? 744 : 690);

      ctx.drawImage(officialLogo, 219, 965, 390, 105);

      return poster;
    }

    async function openPosterPreview() {
      const withAmount = state.amountMode === 'fixed';
      const poster = await buildPoster(withAmount);
      state.posterUrl = poster.toDataURL('image/png');
      state.posterHasAmount = withAmount;
      $('#poster-image').src = state.posterUrl;
      $('#poster-mode').textContent = withAmount ? '含固定金额' : '家长自填金额';
      $('#poster-dialog').classList.add('open');
      $('#poster-save').focus();
    }
    function savePoster() {
      if (!state.posterUrl) return;
      const link = document.createElement('a');
      link.download = `收款二维码_${state.posterHasAmount ? state.fixedAmount + '元' : '未设置金额'}.png`;
      link.href = state.posterUrl;
      document.body.append(link);
      link.click();
      link.remove();
      $('#poster-dialog').classList.remove('open');
      toast('二维码海报已开始下载');
    }

    function openAmountEditor() {
      const input = $('#amount-input');
      input.value = state.amountMode === 'fixed' ? state.fixedAmount : '';
      $('#amount-dialog').classList.add('open');
      input.focus();
      input.select();
    }
    function closeAmountEditor() {
      if (!$('#amount-dialog').classList.contains('open')) return;
      $('#amount-input').blur();
      $('#amount-dialog').classList.remove('open');
      $('#set-amount').focus({ preventScroll: true });
    }
    function updateAmountDisplay() {
      const fixed = state.amountMode === 'fixed';
      $('#hero-copy').textContent = fixed ? '固定收款金额' : '使用微信扫码，填写金额支付';
      $('#fixed-amount').textContent = money(state.fixedAmount);
      $('#fixed-amount').hidden = !fixed;
      $('#set-amount').textContent = fixed ? '修改金额' : '设置金额';
      $('#clear-amount').hidden = !fixed;
      $('#qr-note').hidden = fixed;
      drawQr($('#qr'), `${fixed ? `fixed-${state.fixedAmount}` : 'input'}-teacher-${state.teacher}`);
    }
    $('#teacher-switch').addEventListener('click', () => {
      state.teacher = !state.teacher;
      $('#teacher-switch').setAttribute('aria-checked', state.teacher);
      $('#teacher-copy').textContent = state.teacher ? '经手人：张老师' : '不记录经手人';
      updateAmountDisplay();
    });
    $('#set-amount').addEventListener('click', openAmountEditor);
    $('#amount-cancel').addEventListener('click', closeAmountEditor);
    $('#amount-close').addEventListener('click', closeAmountEditor);
    $('#amount-dialog').addEventListener('click', event => {
      if (event.target === $('#amount-dialog')) closeAmountEditor();
    });
    $('#amount-form').addEventListener('submit', event => {
      event.preventDefault();
      const value = Number($('#amount-input').value);
      if (!Number.isFinite(value) || value <= 0 || value > 999999) {
        toast('请输入 0.01 至 999999 元的有效金额');
        $('#amount-input').focus();
        return;
      }
      state.fixedAmount = value.toFixed(2);
      state.amountMode = 'fixed';
      updateAmountDisplay();
      closeAmountEditor();
    });
    $('#clear-amount').addEventListener('click', () => {
      state.amountMode = 'input';
      updateAmountDisplay();
    });
    $('#download').addEventListener('click', openPosterPreview);
    $('#poster-close').addEventListener('click', () => $('#poster-dialog').classList.remove('open'));
    $('#poster-cancel').addEventListener('click', () => $('#poster-dialog').classList.remove('open'));
    $('#poster-save').addEventListener('click', savePoster);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        $('#poster-dialog').classList.remove('open');
        closeAmountEditor();
      }
    });

    updateAmountDisplay();
  </script>
</body>
</html>
